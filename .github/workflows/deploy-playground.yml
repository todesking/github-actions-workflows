# Reusable GitHub Pages deployment for wasm playgrounds: builds with the
# given script and deploys the resulting dist/ directory.
#
# The caller must grant these permissions:
#   contents: read
#   pages: write
#   id-token: write
name: Deploy playground (reusable)

on:
  workflow_call:
    inputs:
      build-script:
        description: Command that builds the playground.
        type: string
        required: true
      dist-path:
        description: Directory uploaded as the Pages artifact.
        type: string
        required: true
      wasm-pack-version:
        description: wasm-pack version to install.
        type: string
        default: "0.15.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # On a workflow_run trigger the default checkout would be the current
      # HEAD of the default branch, which may be newer than the commit the
      # triggering workflow (e.g. CI) actually validated. Pin to the
      # validated commit; head_sha is empty for other triggers, so fall
      # back to the usual github.sha.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Creates the Pages site with the "GitHub Actions" source if it
      # doesn't exist yet, so no manual repo-settings step is needed.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      # Third-party actions are pinned to a commit SHA; Dependabot keeps
      # the pin and the version comment in sync.
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          # Required when pinned to a SHA: the toolchain can no longer be
          # inferred from the ref name.
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install wasm-pack
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: wasm-pack@${{ inputs.wasm-pack-version }}

      - name: Build playground
        run: ${{ inputs.build-script }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ inputs.dist-path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
